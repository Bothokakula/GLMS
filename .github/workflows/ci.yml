name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GLMS.sln
      - run: dotnet build GLMS.sln --no-restore --configuration Release
      - run: dotnet test GLMS.sln --no-build --configuration Release --verbosity normal
